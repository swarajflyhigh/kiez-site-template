<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Danke, Kiez Café</title>
<style>
  :root { --bg:#f7f3ec; --ink:#1c1917; --ink-2:#5b554d; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 Inter, system-ui, sans-serif; padding:24px; }
  main { max-width:420px; text-align:center; }
  h1 { font:italic 400 40px/1.1 "Instrument Serif", Georgia, serif; margin:0 0 12px; }
  p { color:var(--ink-2); margin:0 0 20px; }
  a { display:inline-flex; align-items:center; height:44px; padding:0 20px; border-radius:999px; background:var(--ink); color:#fff; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>Danke!</h1>
  <p>Deine Reservierung ist angekommen. Wir melden uns kurz per Nachricht, sobald wir sie bestätigt haben.</p>
  <a href="/">Zurück zur Seite</a>
</main>
</body>
</html>
